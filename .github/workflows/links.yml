# Linkprüfung (vorgezogener Teil von Phase 6; CLAUDE.md 9, 10.11.2026): baut die Seite wie pages.yml und prüft mit
# tools/links_pruefen.py jeden Verweis in den gebauten Seiten (Dateien, Anker; „erst mit Daten“, solange der
# Datenexport fehlt) und die externen Links (HEAD, je Host höchstens eine Anfrage alle 2 s, Obergrenze je Lauf).
# Server der Stadt Wuppertal werden nie angefragt, ihre Links als „nicht geprüft“ ausgewiesen (CLAUDE.md 5.1); ebenso
# die Kachelserver von OpenStreetMap und mailto:. Ergebnis als TSV im Artefakt „links“. Monatlich tagsüber, nicht im
# nächtlichen Zeitfenster der OParl-Messungen (23–1 Uhr); keine Secrets, nur Leserecht.
# Mit Ratsdaten (Phase 6, 23.11.2026): liest den letzten Abrufstand aus dem Zwischenspeicher von pages.yml (nur lesen,
# kein Abruf) und baut die Seite wie dort (Vorschau, Haushalt), damit auch Vorgangs- und Gebietsseiten geprüft werden.
name: Linkprüfung

on:
  # am 3. jedes Monats um 8:23 UTC (9:23 Uhr MEZ, 10:23 Uhr MESZ)
  schedule:
    - cron: "23 8 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rohdaten des letzten Abrufs (nur lesen)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
            data/export/abrufstatistik_seiten.tsv
            data/export/audit_aenderungen.tsv
          key: raw-links-${{ github.run_id }}
          restore-keys: raw-
      - name: Aufbereiten (ohne Abruf)
        env:
          RATSATLAS_ZUSATZTHEMEN: "haushalt"
          RATSATLAS_VORSCHAU: "ja"
        run: |
          if [ -s data/raw/papers.jsonl ]; then
            python -m pipeline amtskopf
            python -m pipeline build
            python -m pipeline export
          else
            echo "::notice::Kein Abrufstand im Zwischenspeicher: Seite ohne Ratsdaten."
          fi
      - name: Seite bauen (ohne Abruf)
        env:
          RATSATLAS_GEBIETSKARTE: "ja"
          RATSATLAS_ZUSATZTHEMEN: "haushalt"
          RATSATLAS_VORSCHAU: "ja"
        run: python tools/seite_bauen.py _site
      - name: Links prüfen
        run: python tools/links_pruefen.py _site --extern --aus links.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: links
          path: links.tsv
          if-no-files-found: warn
          retention-days: 14
