# Tests der Pipeline und der Messwerkzeuge mit synthetischen Daten und lokalen Testservern; keine Anfragen an Server
# der Stadt Wuppertal oder an andere externe Server (ohne RATSATLAS_STADT_INFORMIERT bzw. RATSATLAS_MESSUNG_FREIGEGEBEN
# sperren pipeline/abruf.py und explore/abruf.py). Aus ratsatlas-koeln @d609111 (.github/workflows/tests.yml),
# Kommentar auf Wuppertal umgestellt; aktiv neben pages.yml (Veröffentlichung ohne Abruf).
# Job browser (Phase 4): Browser-Prüfung mit Playwright und axe-core nach dem Bonner Vorbild (allris-test @52fe9ca,
# Job browser), aber mit erfundenen Daten (tests/browser/testseite.py, lokaler OParl-Testserver) statt Rohdaten aus dem
# Zwischenspeicher oder einem Abruf; Netz nur für pip, npm und den Download von Chromium und Firefox durch Playwright.
# Zwischenspeicher nur für pip-Pakete (setup-python, cache: pip), keine Daten. Firefox prüft Tastatur und WCAG der
# Karte zusätzlich: Firefox erreicht SVG-Pfade nur mit tabindex, Chromium ohne tabindex nur Pfade mit Tooltip
# (focus-Listener; inventur/WCAG_vorpruefung.md).
name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # pypdf nur für die Tests der Messstufe 6 (PDF-Köpfe, explore/); ohne pypdf würden sie übersprungen. Version wie
      # lokal geprüft (Wuppertaler Abweichung von Köln)
      - run: pip install -r requirements.txt pytest pypdf==6.17.0
      - name: Pipeline und Messwerkzeuge (Abruf gegen lokale Testserver, Aufbereitung, Export)
        run: python -m pytest -v -rs tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Syntax der Webseite
        run: for f in site/app.js site/timeline.js site/tour.js site/rss.js site/technik.js; do node --check "$f"; done

  browser:
    # fest auf 24.04 wie Bonn: Playwright installiert Chromium nicht auf jedem ubuntu-latest (Bonn, 27.10.2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Playwright und axe-core (Versionen aus tests/browser/package-lock.json)
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
      # Jede Testdatei erzeugt die Testseite selbst (testseite.py) und liefert sie auf 127.0.0.1 aus; Anfragen an
      # andere Hosts blockiert der Test und schlägt dann fehl
      - name: Browser-Prüfung (Karte, Zeitleiste, Links, Vorgang, Begriffe, Gebiete, Tastatur; WCAG 2.1 A und AA)
        run: node --test "tests/browser/*.test.mjs"
      - name: Browser-Prüfung in Firefox (Tastatur auf der Karte, Tastatur, WCAG 2.1 A und AA)
        env:
          BROWSER: firefox
        run: node --test tests/browser/karte-tastatur.test.mjs tests/browser/tastatur.test.mjs tests/browser/wcag.test.mjs
