# Ratsatlas Wuppertal: Ratsdaten abrufen, aufbereiten und veröffentlichen (CLAUDE.md 5.1, 7.5; Vorschau für die Stadt,
# Entscheidung 17.11.2026). Aufbau nach ratsatlas-koeln (pages.yml: Abruf in Actions, Zwischenspeicher, Wächter).
# Die fertige Seite geht (1) in den Branch deploy, ohne Historie (ein Commit je Lauf, Force-Push; CLAUDE.md 2 und 7.5),
# aus dem Plesk-Git die Hauptadresse https://wuppertal.ratsatlas.de/ beliefert (docs/PLESK.md), und (2) auf GitHub Pages
# als Ausweichadresse mit Canonical auf die Hauptadresse (SITE_URL).
#
# Abruf: nur nachts (Zeitplan 23:05 Uhr Winterzeit, 0:05 Uhr Sommerzeit; beides im Zeitfenster 23–1 Uhr) oder auf
# Knopfdruck mit „abruf“, und nur mit der Repository-Variable RATSATLAS_STADT_INFORMIERT = „ja“ (Einstellungen → Secrets
# and variables → Actions → Variables). Die Stadt hat dem Abruf aus GitHub Actions und der vorzeitigen Veröffentlichung
# am 17.11.2026 mündlich zugestimmt (schriftlich ausstehend). Abrufpolitik wie im Code (pipeline/abruf.py,
# pipeline/sessionnet.py): eine Verbindung, Abstand, Zeitfenster, Pausen, inkrementell über modified_since.
# Erster Lauf: Der Zwischenspeicher ist leer; ein Wächter hält den Abruf ohne Abrufzustand an, außer mit der Variable
# RATSATLAS_VOLLABRUF = „ja“ (Vollabruf ab Seite 1, rund 1.300 Anfragen, etwa eine Stunde). Nach der ersten Nacht die
# Variable löschen, sonst jede Nacht ein Vollabruf.
# Ohne Abruf (Push auf main, Knopfdruck ohne „abruf“) baut der Lauf aus dem letzten Stand im Zwischenspeicher; gibt es
# keinen vollständigen Abruf, entsteht die Gebietskarte ohne Ratsdaten wie bisher.
# Vorschau (RATSATLAS_VORSCHAU = „ja“, Entscheidung 17.11.2026): Ratsdaten auf der Hauptadresse, nicht indexiert
# (noindex, X-Robots-Tag, robots.txt ohne Sitemap) und mit Hinweis im Startfenster; Zusatzthema „haushalt“ an.
# Volltexte liegen nicht in Actions: Orte aus Volltexten kommen aus data/volltext/orte_volltext.json (abgeleitet, ohne
# Text; lokal aus dem Dokumentabruf erzeugt). Kein Dokumentabruf in diesem Workflow.
# Drei Jobs, nur auf main: bauen (Leserecht; Abruf, Aufbereitung, Seite), deploy (Schreibrecht, führt weder pip noch
# Code des Repositorys aus) und pages; deploy und pages hängen nur von bauen ab.
# Name bleibt „Seite veröffentlichen“: live.yml startet nach diesem Workflow (workflow_run)
name: Seite veröffentlichen

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "5 22 * * *"   # 23:05 Uhr, im Sommer 0:05 Uhr Ortszeit (Zeitfenster 23–1 Uhr)
  workflow_dispatch:
    inputs:
      abruf:
        description: "Ratsdaten abrufen (nur im Zeitfenster 23–1 Uhr wirksam)"
        type: boolean
        default: false

# Rechte je Job: Lesen als Vorgabe, Schreiben nur, wo ein Job es braucht
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Abruf höchstens bis zum Ende des Zeitfensters (1 Uhr) plus Pausen; Aufbereitung rund 15 min
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      ABRUF: ${{ vars.RATSATLAS_STADT_INFORMIERT == 'ja' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.abruf)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Rohdaten, Abrufzustand, STAND.json, Änderungsprotokoll und Abrufstatistik des letzten Laufs (wie ratsatlas-koeln)
      - name: Rohdaten des letzten Laufs
        id: rohdaten
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
            data/export/abrufstatistik_seiten.tsv
            data/export/audit_aenderungen.tsv
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-

      # Wächter: Ohne Abrufzustand begänne der Abruf ab Seite 1 und die Zählung der Nächte mit möglicher Sperre ginge
      # verloren; nur mit RATSATLAS_VOLLABRUF=ja (erster Lauf oder verlorener Zustand) weiter
      - name: Abrufzustand wiederhergestellt? (Wächter vor dem Abruf)
        if: env.ABRUF == 'true'
        env:
          GEFUNDEN: ${{ steps.rohdaten.outputs.cache-matched-key }}
          RATSATLAS_VOLLABRUF: ${{ vars.RATSATLAS_VOLLABRUF }}
        run: |
          echo "Zwischenspeicher: ${GEFUNDEN:-keiner wiederhergestellt}"
          if [ -f data/raw/zustand_abruf.json ]; then exit 0; fi
          if [ "$RATSATLAS_VOLLABRUF" = "ja" ]; then
            echo "::warning::Kein Abrufzustand im Zwischenspeicher; mit RATSATLAS_VOLLABRUF=ja Vollabruf ab Seite 1. Variable nach dieser Nacht löschen."
            exit 0
          fi
          echo "::error::Kein Abrufzustand (data/raw/zustand_abruf.json) im Zwischenspeicher: kein Abruf. Erster Lauf oder Zustand verloren: Repository-Variable RATSATLAS_VOLLABRUF=ja für eine Nacht setzen."
          exit 1

      - name: Abruf OParl-API Stadt Wuppertal und Änderungsprotokoll
        id: abruf
        if: env.ABRUF == 'true'
        env:
          RATSATLAS_STADT_INFORMIERT: ${{ vars.RATSATLAS_STADT_INFORMIERT }}
          RATSATLAS_KONTAKT: ${{ vars.RATSATLAS_KONTAKT }}
          RATSATLAS_VOLLABRUF: ${{ vars.RATSATLAS_VOLLABRUF }}
        run: |
          python -m pipeline fetch
          python -m pipeline aenderungen

      # Sofort sichern, auch wenn der Abruf scheitert (Zählung der Nächte mit möglicher Sperre); Schlüssel je Versuch,
      # der nächste Lauf nimmt den jüngsten (raw-)
      - name: Abrufzustand sichern
        if: always() && steps.abruf.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
            data/export/abrufstatistik_seiten.tsv
            data/export/audit_aenderungen.tsv
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}

      # Ratsdaten erst nach einem vollständigen Abruf (abruf_ok) und nie mit Testdaten
      - name: Gibt es Ratsdaten zum Veröffentlichen?
        id: daten
        run: |
          if [ -s data/raw/papers.jsonl ] && python -c 'import json,sys; s=json.load(open("data/raw/STAND.json")); sys.exit(0 if s.get("abruf_ok") and not s.get("testdaten") else 1)' 2>/dev/null; then
            echo "da=ja" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Noch kein vollständiger Abruf im Zwischenspeicher: Gebietskarte ohne Ratsdaten."
            echo "da=nein" >> "$GITHUB_OUTPUT"
          fi

      - name: Aufbereiten, Verortung, Export, Prüfung
        if: steps.daten.outputs.da == 'ja'
        env:
          RATSATLAS_ZUSATZTHEMEN: "haushalt"
          RATSATLAS_VORSCHAU: "ja"
        run: |
          python -m pipeline amtskopf
          python -m pipeline build
          python -m pipeline export
          python -m pipeline check
          python -m pipeline package
      # Graue Kartenkacheln aus dem Branch kacheln (kacheln.yml, vierteljährlich; wie Köln); fehlt er, zeigt die Seite
      # OSM-Kacheln grau gefiltert
      - name: Graue Kartenkacheln holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: kacheln
          path: _kacheln
          persist-credentials: false
        continue-on-error: true
      # Bricht ab, wenn index.html, app.js, style.css, .htaccess usw. fehlen oder der Titel nicht stimmt
      - name: Seite bauen und prüfen
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://wuppertal.ratsatlas.de/' }}
          # ohne Ratsdaten: Gebietskarte aus den versionierten Geodaten in data/geo (Freigabe 17.11.2026, CLAUDE.md 9)
          RATSATLAS_GEBIETSKARTE: "ja"
          # mit Ratsdaten: Vorschau für die Stadt, nicht indexiert, mit Haushalt (Entscheidung 17.11.2026)
          RATSATLAS_VORSCHAU: "ja"
          RATSATLAS_ZUSATZTHEMEN: "haushalt"
        run: python tools/seite_bauen.py _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: seite
          path: _site
          include-hidden-files: true   # .htaccess
          if-no-files-found: error
          retention-days: 1
      - name: Seite für GitHub Pages ohne .htaccess (dort wirkungslos)
        run: |
          rm -rf _pages && cp -r _site _pages && rm -f _pages/.htaccess
          test -s _pages/index.html && test -s _pages/app.js && test -s _pages/style.css
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: "_pages"

  # Branch deploy für Plesk; unabhängig vom Job pages, damit ein nicht eingerichtetes GitHub Pages ihn nicht verhindert
  deploy:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # Branch deploy
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: seite
          path: _site
      # Nur die fertige Seite (mit .htaccess), nie Quellcode; ein neuer Commit ohne Vorgänger ersetzt den Branch.
      # Unveränderte Seite: kein Push, damit Plesk nicht ohne Grund neu ausliefert. version.txt (Commit von main) zählt
      # dabei nicht (sie bleibt dann auf dem Stand des Commits im Branch deploy; Live-Prüfung, tools/live_pruefen.py),
      # fehlt sie dort aber, wird neu geschrieben.
      - name: Fertige Seite in den Branch deploy schreiben (ohne Historie)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf _deploy && mkdir _deploy && cp -r _site/. _deploy/
          test -f _deploy/index.html && test -f _deploy/.htaccess
          cd _deploy
          git init -q -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Seite aus ${GITHUB_SHA::7}"
          # Exit-Code 2: Branch fehlt (erster Lauf); jeder andere Fehler (Netz) bricht ab
          rc=0; git ls-remote --exit-code --heads "$url" deploy > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "Abfrage des Branches deploy gescheitert ($rc)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            git fetch -q --depth 1 "$url" deploy
            if git cat-file -e FETCH_HEAD:version.txt 2> /dev/null \
              && git diff --quiet FETCH_HEAD HEAD -- . ':(exclude)version.txt'; then
              echo "Seite unverändert"; exit 0
            fi
          fi
          git push -q --force "$url" HEAD:deploy

  # Ausweichadresse GitHub Pages (Quelle „GitHub Actions“); Canonical zeigt auf die Hauptadresse
  pages:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # GitHub Pages
      id-token: write   # deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
