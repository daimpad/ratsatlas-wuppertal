name: Idee oder Aufgabe
description: Vorschlag für eine Erweiterung, z. B. zu den offenen Punkten in CLAUDE.md Abschnitt 8.
labels: ["idee"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Worum geht es?
      description: Für wen wäre das nützlich, und welches Problem löst es?
    validations:
      required: true
  - type: textarea
    id: daten
    attributes:
      label: Benötigte Daten und Quellen
      description: Welche Felder aus der Wuppertaler OParl-API oder anderen offenen Daten (z. B. offenedaten-wuppertal.de)? Lizenz?
  - type: dropdown
    id: umfang
    attributes:
      label: Geschätzter Umfang
      options:
        - klein (wenige Stunden)
        - mittel (ein Tag)
        - groß (mehrere Tage)
